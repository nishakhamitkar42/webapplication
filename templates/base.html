<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Portfolio of a Logistics and Supply Chain Sales Executive">
    <title>Sales Executive Portfolio</title>
    
    <!-- Link to Custom Premium Stylesheet -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <ul class="nav-links">
            <li class="{% if active_page == 'home' %}active{% endif %}"><a href="/">Home</a></li>
            <li class="{% if active_page == 'about' %}active{% endif %}"><a href="/about">About</a></li>
            <li class="{% if active_page == 'projects' %}active{% endif %}"><a href="/projects">Projects</a></li>
            <li class="{% if active_page == 'certification' %}active{% endif %}"><a href="/certification">Certification</a></li>
            <li class="{% if active_page == 'skills' %}active{% endif %}"><a href="/skills">Skills</a></li>
            <li class="{% if active_page == 'achievements' %}active{% endif %}"><a href="/achievements">Achievements</a></li>
            <li class="{% if active_page == 'contact' %}active{% endif %}"><a href="/contact">Contact</a></li>
        </ul>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2026 Sales Executive Portfolio. All rights reserved. Created in MVC model.</p>
    </footer>

    <!-- Global Application Scripts -->
    <script src="/frontend/js/main.js"></script>
</body>
</html>
